<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>下班待辦</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --bg: #f5f3ef; --card: #ffffff; --ink: #1f1d1a; --muted: #8a857c;
    --line: #e7e3dc; --accent: #06c755; --accent-ink: #ffffff; --chip: #ece8e1;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15140f; --card: #1f1e19; --ink: #f2efe8; --muted: #9a958b;
      --line: #2d2b25; --chip: #2a2822; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 22px; margin: 4px 0 2px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; font: inherit; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); outline: none; }
  input:focus { border-color: var(--accent); }
  button.add { font: inherit; font-weight: 600; padding: 0 18px; border: 0; border-radius: 12px;
    background: var(--accent); color: var(--accent-ink); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 22px; }
  .chip { font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 999px; border: 0;
    background: var(--chip); color: var(--ink); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px;
    background: var(--card); border: 1px solid var(--line); transition: opacity .25s, transform .25s; }
  li.out { opacity: 0; transform: translateX(24px); }
  .box { width: 26px; height: 26px; flex: none; border-radius: 8px; border: 2px solid var(--muted);
    background: none; padding: 0; display: grid; place-items: center; color: var(--accent-ink); }
  li.out .box { background: var(--accent); border-color: var(--accent); }
  .txt { flex: 1; word-break: break-word; }
  .tag { font-size: 12px; color: var(--muted); }
  .due { font-size: 12px; font-weight: 600; color: #e37400; white-space: nowrap; }
  .due.late { color: #d93025; }
  .due.far { color: var(--muted); font-weight: 400; }
  .dueRow { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 14px; color: var(--muted); }
  .dueRow input { flex: none; padding: 6px 10px; font-size: 14px; }
  .dueRow button { font: inherit; font-size: 13px; border: 0; background: none; color: var(--muted); text-decoration: underline; padding: 0; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .wx { background: #2f80ed; color: #fff; border-radius: 16px; padding: 16px; margin-bottom: 22px; font-size: 14px; }
  .wx b { font-size: 32px; line-height: 1.1; }
  .wx .row { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
  .wx .hours { display: flex; gap: 6px; overflow-x: auto; margin-top: 12px; padding-bottom: 2px; }
  .wx .h { flex: none; text-align: center; background: rgba(255,255,255,.15); border-radius: 10px; padding: 6px 8px; font-size: 12px; }
  .wx .tip { margin-top: 8px; }
  .msg { text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>
<main>
  <section class="wx" id="wx">萬華天氣載入中…</section>

  <h1>下班待辦</h1>
  <p class="sub">18:00 提醒還沒做的事．有期限的到前 3 天才提醒</p>

  <form id="f">
    <input id="t" placeholder="例如：買垃圾袋" maxlength="60" autocomplete="off" enterkeyhint="done">
    <button class="add" type="submit">新增</button>
  </form>
  <div class="dueRow">期限（可不填）<input type="date" id="d"><button type="button" id="dc">清除</button></div>
  <div class="chips" id="chips"></div>

  <ul id="list"></ul>
  <p class="msg" id="msg">載入中…</p>
</main>

<script>
const LIFF_ID = '2012692937-qW8TXazD';
const API = 'https://n8n.aiqkangber.com/webhook/life-todo';
const QUICK = ['垃圾袋', '蝦皮取貨', '衛生紙', '洗衣精'];

const $ = (id) => document.getElementById(id);
let todos = [];

async function call(action, extra = {}) {
  const res = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, idToken: liff.getIDToken(), ...extra }),
  });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'error');
  todos = data.todos;
  render();
}

function render() {
  $('msg').textContent = '';
  $('list').innerHTML = '';
  if (!todos.length) { $('msg').textContent = '沒有待辦，今天可以直接回家 🎉'; }
  const today = new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
  const left = (t) => Math.round((Date.parse(t.due) - Date.parse(today)) / 86400e3);
  const sorted = [...todos].sort((a, b) => (a.due ? left(a) : 99) - (b.due ? left(b) : 99));
  for (const t of sorted) {
    const li = document.createElement('li');
    li.innerHTML = `<button class="box" aria-label="完成">✓</button>
      <span class="txt"></span>${t.due ? dueHtml(left(t), t.due) : ''}${t.source === 'shopee' ? '<span class="tag">蝦皮</span>' : ''}`;
    li.querySelector('.txt').textContent = t.text;
    li.querySelector('.box').onclick = async () => {
      li.classList.add('out');
      try { await call('done', { id: t.id }); } catch { li.classList.remove('out'); alertMsg(); }
    };
    $('list').appendChild(li);
  }
  $('chips').innerHTML = '';
  for (const q of QUICK) {
    if (todos.some(t => t.text === q)) continue;
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = '＋' + q;
    b.onclick = () => add(q);
    $('chips').appendChild(b);
  }
}

function dueHtml(n, due) {
  const md = +due.slice(5, 7) + '/' + +due.slice(8, 10);
  const cls = n <= 0 ? 'due late' : n <= 3 ? 'due' : 'due far';
  const txt = n < 0 ? `逾期${-n}天` : n === 0 ? '今天截止' : `${md}前・剩${n}天`;
  return `<span class="${cls}">${txt}</span>`;
}

function alertMsg() { $('msg').textContent = '連線失敗，關掉再開一次試試'; }

async function add(text, due = '') {
  text = text.trim();
  if (!text) return;
  try { await call('add', { text, due }); } catch { alertMsg(); }
}

$('dc').onclick = () => { $('d').value = ''; };
$('f').onsubmit = (e) => {
  e.preventDefault();
  const v = $('t').value, d = $('d').value; $('t').value = ''; $('d').value = '';
  add(v, d);
};

async function loadWeather() {
  try {
    const u = 'https://api.open-meteo.com/v1/forecast?latitude=25.03&longitude=121.50&current=temperature_2m,apparent_temperature&hourly=temperature_2m,precipitation_probability&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTaipei&forecast_days=2';
    const d = await (await fetch(u)).json();
    const lo = Math.round(d.daily.temperature_2m_min[0]), hi = Math.round(d.daily.temperature_2m_max[0]);
    const rain = d.daily.precipitation_probability_max[0];
    const nowH = new Date().getHours();
    const start = d.hourly.time.findIndex(t => +t.slice(11, 13) === nowH && t.slice(0, 10) === d.current.time.slice(0, 10));
    let hours = '';
    for (let i = Math.max(start, 0); i < Math.max(start, 0) + 12 && i < d.hourly.time.length; i++) {
      hours += `<div class="h">${d.hourly.time[i].slice(11, 13)}時<br>${Math.round(d.hourly.temperature_2m[i])}°<br>💧${d.hourly.precipitation_probability[i]}%</div>`;
    }
    const tips = [];
    if (lo <= 14) tips.push('🧥 很冷，穿厚外套'); else if (lo <= 18) tips.push('🧥 偏涼，帶件外套');
    if (rain >= 50) tips.push('☔ 會下雨，帶傘');
    $('wx').innerHTML = `<div class="row"><div>萬華現在<br><b>${d.current.temperature_2m}°C</b></div>
      <div style="text-align:right">體感 ${d.current.apparent_temperature}°C<br>${lo}～${hi}°C｜降雨 ${rain}%</div></div>
      ${tips.length ? `<div class="tip">${tips.join('　')}</div>` : ''}<div class="hours">${hours}</div>`;
  } catch { $('wx').textContent = '天氣載入失敗'; }
}
loadWeather();

liff.init({ liffId: LIFF_ID }).then(() => {
  if (!liff.isLoggedIn()) return liff.login();
  return call('list');
}).catch(() => alertMsg());
</script>
</body>
</html>
